name: Verify Poisson studies

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'evidence/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'evidence/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-linux-py312.lock
      - run: python -m pytest -q -m 'not mfem and not mpi'

  integration:
    name: MFEM source build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
      JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-linux-py312.lock
            requirements-challenge.lock
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-challenge.lock
      - run: ./scripts/build_mfem.sh
      - run: ./scripts/build_solver.sh
      - name: Check sparse CFAC algebraic bounds and MFEM primal proposal
        run: |
          cmake --build build/cpp --target cfac_pcg
          python -m pytest -q tests/test_cfac_sparse.py
          python -m research.cfac.sparse_diagnostics --scale 8 --binary build/cpp/cfac_pcg --directory runs/cfac-native-smoke
      - run: python -m pytest -q -m mfem --require-mfem
      - name: Replay a transient field study
        run: |
          python -m sciagent pde-study --family wave --dimension 3 --order 2 --levels 2 4 8 --directory runs/wave > wave-receipt.json
          digest="$(python -c "import json; print(json.load(open('wave-receipt.json'))['manifest_sha256'])")"
          python -m sciagent verify-pde runs/wave --manifest-sha256 "$digest"
      - run: python -m sciagent quickstart
      - name: Verify the candidate-to-solver path and replay its evidence
        run: |
          python -m sciagent plan specs/stage4/choose_diffusion.json --directory runs/planner-smoke --execute > runs/planner-receipt.json
          digest="$(python -c "import json; print(json.load(open('runs/planner-receipt.json'))['manifest_sha256'])")"
          python -m sciagent verify-plan runs/planner-smoke --manifest-sha256 "$digest"
      - name: Verify generated and Gmsh scalar studies against scikit-fem
        run: python -m benchmarks.stage2 --directory runs/stage2 --report runs/stage2.json
      - name: Challenge the verifier on independently certified MFEM controls
        run: python -m benchmarks.robustness --generate-controls runs/challenge-controls --report runs/challenge.json --check-profiling
      - name: Run and replay a paired verified-time smoke study
        run: |
          python -m benchmarks.e1 --directory runs/e1 --scale compact --workloads C1 H2 --warmups 0 --repetitions 1
          digest="$(sha256sum runs/e1/campaign.json | cut -d' ' -f1)"
          python -m benchmarks.e1_audit --directory runs/e1 --campaign-sha256 "$digest" --all --output runs/e1-audit.json
      - name: Check the revision timing and offline audit on one real MFEM case
        run: |
          cpu="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          python -m benchmarks.verified_revision --baseline "$PWD" --candidate "$PWD" --directory runs/revision --scale compact --workloads C1 --blocks 2 --cpu "$cpu"
          design="$(sha256sum runs/revision/design.json | cut -d' ' -f1)"
          report="$(sha256sum runs/revision/report.json | cut -d' ' -f1)"
          python -m benchmarks.verified_revision_audit --directory runs/revision --design-sha256 "$design" --report-sha256 "$report" --output runs/revision-audit.json
          attempt="$(find runs/revision/C1_000_baseline/studies -type d -name attempt_01)"
          taskset -c "$cpu" python -m benchmarks.verification_cost --baseline "$PWD" --candidate "$PWD" --attempt "$attempt" --blocks 2 --expect-verdict ACCEPTED --output runs/replay-cost.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('runs/challenge.json', 'runs/stage2.json') != ''
        with:
          name: scalar-verification-reports
          path: |
            runs/challenge.json
            runs/stage2.json
            runs/e1-audit.json
            runs/revision-audit.json
            runs/replay-cost.json
