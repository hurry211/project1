name: Verify Poisson studies

on:
  push:
    paths-ignore: ['**.md', 'docs/**', 'evidence/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'evidence/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: '1'

jobs:
  unit:
    name: Python unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-linux-py312.lock
      - run: python -m pytest -q -m 'not mfem'

  integration:
    name: MFEM source build and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-13
      CXX: g++-13
      JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-linux-py312.lock
      - run: python -m pip install --require-hashes --only-binary=:all: -r requirements-linux-py312.lock
      - run: ./scripts/build_mfem.sh
      - run: ./scripts/build_solver.sh
      - run: python -m pytest -q -m mfem --require-mfem
      - run: python -m sciagent quickstart
