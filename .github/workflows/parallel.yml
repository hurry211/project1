name: Verify MPI Poisson study

on:
  push:
    paths: ['cpp/mpi/**', 'verifier/mpi.py', 'sciagent/mpi_study.py', 'benchmarks/mpi_scaling.py', 'scripts/*mpi.sh', 'tests/test_mpi*.py', '.github/workflows/parallel.yml']
  pull_request:
    paths: ['cpp/mpi/**', 'verifier/mpi.py', 'sciagent/mpi_study.py', 'benchmarks/mpi_scaling.py', 'scripts/*mpi.sh', 'tests/test_mpi*.py', '.github/workflows/parallel.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CC: gcc-13
      CXX: g++-13
      JOBS: '3'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-13 cmake make time openmpi-bin=4.1.6-7ubuntu2 libopenmpi3t64=4.1.6-7ubuntu2 libhypre-2.28.0=2.28.0-8build2 libmetis5=5.1.0.dfsg-7build3
          python -m pip install --require-hashes --only-binary=:all: -r requirements-challenge.lock
      - name: Build serial control and separate MPI driver
        run: |
          bash scripts/build_mfem.sh
          bash scripts/build_solver.sh
          MPI_MFEM_SOURCE="$PWD/third_party/mfem-src" bash scripts/build_mfem_mpi.sh
          bash scripts/build_solver_mpi.sh
      - name: Verify numerical and process contracts
        run: python -m pytest -q --require-mfem --require-mpi
      - name: Compare serial and parallel fields and replay the campaign
        run: |
          python -m sciagent mpi-study --directory runs/mpi > mpi-receipt.json
          digest="$(python -c "import json; print(json.load(open('mpi-receipt.json'))['manifest_sha256'])")"
          python -m sciagent verify-mpi runs/mpi --manifest-sha256 "$digest"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && hashFiles('mpi-receipt.json') != ''
        with:
          name: paired-mpi-campaign
          path: |
            mpi-receipt.json
            runs/mpi
